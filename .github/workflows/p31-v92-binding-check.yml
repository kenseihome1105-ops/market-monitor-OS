# P0-31 candidate only. Isolated branch; no push, PR, or schedule triggers.
# Promotion and any execution require separate Owner approval.
# The trusted digest must be independently computed from the Owner-confirmed active V92 Web App URL.
# Never derive the expected digest from MARKET_INGEST_URL or another GitHub secret.
# MATCH proves exact URL-byte equality only: NOT V92 source parity, Writer/Reader safety, or capacity recovery.
# The job ref gate protects this job only, not other workflows or repository secret use.
name: P31 V92 endpoint binding check (manual-only candidate)

on:
  workflow_dispatch:
    inputs:
      expected_v92_url_sha256:
        description: 'Owner-verified SHA-256 of active V92 /exec URL; never derived from GitHub Secrets'
        required: true
        type: string

permissions: {}

jobs:
  compare-only:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Compare without HTTP or sensitive output
        shell: bash
        env:
          MARKET_INGEST_URL: ${{ secrets.MARKET_INGEST_URL }}
          EXPECTED_V92_URL_SHA256: ${{ inputs.expected_v92_url_sha256 }}
        run: |
          node <<'NODE'
          'use strict';
          const crypto = require('node:crypto');
          const raw = process.env.MARKET_INGEST_URL;
          const expected = process.env.EXPECTED_V92_URL_SHA256;
          function canonicalGasExec(value) {
            if (typeof value !== 'string' || value.length > 2048 || /[\r\n]/.test(value)) return false;
            try {
              const u = new URL(value);
              return u.protocol === 'https:' &&
                u.hostname === 'script.google.com' &&
                u.username === '' &&
                u.password === '' &&
                u.port === '' &&
                u.search === '' &&
                u.hash === '' &&
                /^\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(u.pathname) &&
                u.href === value;
            } catch {
              return false;
            }
          }
          let status = 'UNKNOWN';
          if (canonicalGasExec(raw) &&
              typeof expected === 'string' &&
              /^[0-9a-fA-F]{64}$/.test(expected)) {
            const actualBytes = crypto.createHash('sha256').update(raw, 'utf8').digest();
            const expectedBytes = Buffer.from(expected, 'hex');
            status = crypto.timingSafeEqual(actualBytes, expectedBytes) ? 'MATCH' : 'MISMATCH';
          }
          // MATCH certifies only the exact Web App URL bytes, not deployed source/version.
          console.log(status);
          if (status !== 'MATCH') process.exitCode = status === 'MISMATCH' ? 1 : 2;
          NODE
