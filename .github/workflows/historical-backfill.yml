name: Historical Backfill

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Reprocess completed items (required for a specific item ID)"
        required: false
        type: boolean
        default: false
      db_item_id:
        description: "Optional exact DB item ID to reprocess, for example 06OUTR-051"
        required: false
        type: string
        default: ""
      auto_continue:
        description: "Continue successful runs in 5-item batches until no targets remain"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  historical-backfill:
    concurrency:
      group: market-monitor-os-historical-backfill
      queue: max
      cancel-in-progress: false
    outputs:
      has_more: ${{ steps.run-backfill.outputs.has_more }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Test title matching
        run: node --test historical-backfill.test.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run historical backfill
        id: run-backfill
        env:
          MARKET_INGEST_URL: ${{ secrets.MARKET_INGEST_URL }}
          MARKET_INGEST_SECRET: ${{ secrets.MARKET_INGEST_SECRET }}
          HISTORICAL_FORCE: ${{ inputs.force }}
          HISTORICAL_TARGET_DB_ITEM_ID: ${{ inputs.db_item_id }}
          HISTORICAL_AUTO_CONTINUE: ${{ inputs.auto_continue }}
        run: node historical-backfill.js

  continue-backfill:
    needs: historical-backfill
    if: >-
      ${{ inputs.auto_continue && !inputs.force && inputs.db_item_id == '' &&
          needs.historical-backfill.outputs.has_more == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Pause before the next batch
        run: sleep 180

      - name: Dispatch the next batch
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          curl --fail-with-body --silent --show-error
          --request POST
          --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/historical-backfill.yml/dispatches"
          --header "Accept: application/vnd.github+json"
          --header "Authorization: Bearer ${GH_TOKEN}"
          --header "X-GitHub-Api-Version: 2022-11-28"
          --data '{"ref":"main","inputs":{"force":"false","db_item_id":"","auto_continue":"true"}}'
