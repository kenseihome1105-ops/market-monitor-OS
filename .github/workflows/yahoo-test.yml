name: Yahoo Test

on:
  schedule:
    - cron: "10,40 * * * *"
  workflow_dispatch:

jobs:
  yahoo-test:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1]
    concurrency:
      group: market-monitor-os-yahoo-shard-${{ matrix.shard }}
      queue: single
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Yahoo test
        env:
          MARKET_INGEST_URL: ${{ secrets.MARKET_INGEST_URL }}
          MARKET_INGEST_SECRET: ${{ secrets.MARKET_INGEST_SECRET }}
          YAHOO_TEST_SHARD_INDEX: ${{ matrix.shard }}
          YAHOO_TEST_SHARD_COUNT: "2"
        run: node yahoo-test.js
