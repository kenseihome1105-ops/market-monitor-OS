name: Market Valuation Batch

on:
  schedule:
    - cron: "4-54/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-monitor-os-valuation
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run bounded worker
        env:
          MARKET_INGEST_URL: ${{ secrets.MARKET_INGEST_URL }}
          MARKET_INGEST_SECRET: ${{ secrets.MARKET_INGEST_SECRET }}
          MONITOR_FAST_MODE: "true"
        run: node market-comps-worker.js
