name: Monitor flow unit tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'codex/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check monitor.js
          node --check yahoo-test.js
          node --check historical-backfill.js
          node --check market-comps-worker.js
          node --check yahoo-deadline-worker.js
