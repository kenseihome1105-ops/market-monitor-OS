name: Historical Backfill Batch

on:
  schedule:
    - cron: "51 3-23/4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-monitor-os-production
  queue: max
  cancel-in-progress: false

jobs:
  historical-backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Test title matching
        run: node --test historical-backfill.test.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run one backfill batch
        env:
          MARKET_INGEST_URL: ${{ secrets.MARKET_INGEST_URL }}
          MARKET_INGEST_SECRET: ${{ secrets.MARKET_INGEST_SECRET }}
          HISTORICAL_FORCE: "false"
          HISTORICAL_TARGET_DB_ITEM_ID: ""
          HISTORICAL_AUTO_CONTINUE: "false"
        run: node historical-backfill.js
