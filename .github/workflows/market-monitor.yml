name: Market Monitor Test

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  monitor:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    concurrency:
      group: market-monitor-os-mercari-shard-${{ matrix.shard }}
      queue: single
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run market monitor
        env:
          MARKET_INGEST_URL: ${{ secrets.MARKET_INGEST_URL }}
          MARKET_INGEST_SECRET: ${{ secrets.MARKET_INGEST_SECRET }}
          MARKET_MONITOR_SHARD_INDEX: ${{ matrix.shard }}
          MARKET_MONITOR_SHARD_COUNT: "6"
        run: npm run monitor
