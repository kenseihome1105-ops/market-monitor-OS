name: Market Monitor Test

on:
  schedule:
    - cron: "7-57/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-monitor-os-mercari-discovery
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Monitor condition shard (10-item lanes)
        env:
          MARKET_INGEST_URL: ${{ secrets.MARKET_INGEST_URL }}
          MARKET_INGEST_SECRET: ${{ secrets.MARKET_INGEST_SECRET }}
          MONITOR_FAST_MODE: "true"
          MONITOR_SHARD_COUNT: "4"
          MONITOR_SHARD_INDEX: ${{ matrix.shard }}
        run: node monitor.js
